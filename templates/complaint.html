<!DOCTYPE html>
<html>
<head>
<title>Complaint Form</title>

<style>

body{
font-family:Arial;
background:#e8f5e9;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:white;
padding:30px;
width:350px;
border-radius:15px;
box-shadow:0 5px 20px #aaa;
}

h2{
text-align:center;
color:#2e7d32;
}

input,textarea,select{

width:100%;
padding:10px;
margin:10px 0;
border-radius:8px;
border:1px solid #ccc;

}

button{

width:100%;
padding:12px;
background:#2e7d32;
color:white;
border:none;
border-radius:8px;
font-size:16px;

}

</style>

</head>

<body>

<div class="box">

<h2>🚻 Complaint Form</h2>

<form action="/submit_complaint" method="POST">

<select name="location">

<option>Bus Stand</option>
<option>Railway Station</option>
<option>Hospital</option>
<option>Market</option>

</select>


<textarea name="complaint_text"
placeholder="Enter your complaint"
required></textarea>


<button type="submit">
Submit Complaint
</button>


</form>

</div>

</body>
</html>
