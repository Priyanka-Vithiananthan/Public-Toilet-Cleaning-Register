<!DOCTYPE html>
<html>
<head>
    <title>Login - Public Toilet Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dff9fb, #f1f2f6);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 350px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            text-align: center;
        }

        h2 {
            color: #00695c;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #009688;
        }

        button {
            width: 95%;
            padding: 12px;
            margin-top: 15px;
            background: #009688;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #00796b;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: gray;
        }

    </style>
</head>

<body>

<div class="login-box">

    <h2>🚻 Public Toilet</h2>
    <h3>Cleaning Management System</h3>

    <p>Login to access dashboard</p>

    <form action="/dashboard">

        <input type="text" placeholder="Enter Username" required>

        <input type="password" placeholder="Enter Password" required>

        <button type="submit">Login</button>

    </form>

    <br><br>

    <a href="/complaint" style="
    text-decoration:none;
    color:#009688;
    font-size:14px;">
    Public Complaint Form
    </a>

    <div class="footer">
        Smart Clean Monitoring System
    </div>

</div>

</body>
</html>
